name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11: the oldest supported; structured output needs typing_extensions there.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      # The tests start an amqtt broker on a free port and run the tools against it.
      - run: python -m pytest
